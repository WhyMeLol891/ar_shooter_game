<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Model Test</title>
    <style>
        body { margin: 0; background: #111; color: #fff; overflow: hidden; font-family: sans-serif; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div id="info">Loading model...</div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(1, 2, 2);
        scene.add(dirLight);

        const loader = new GLTFLoader();
        let mixer = null;

        loader.load('assets/models/fps-akm.glb', (gltf) => {
            const model = gltf.scene;
            const animations = gltf.animations || [];
            
            // Log bounding box
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);
            const center = new THREE.Vector3();
            box.getCenter(center);

            document.getElementById('info').innerHTML = `
                Model loaded!<br>
                Box size: ${size.x.toFixed(2)}, ${size.y.toFixed(2)}, ${size.z.toFixed(2)}<br>
                Center: ${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)}<br>
                Animations: ${animations.map(a => a.name).join(', ')}
            `;

            scene.add(model);

            if (animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                const idle = animations.find(a => /idle/i.test(a.name)) || animations[0];
                mixer.clipAction(idle).play();
            }
        }, undefined, (err) => {
            document.getElementById('info').textContent = 'Error: ' + err.message;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            if (mixer) mixer.update(dt);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
